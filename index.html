<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0F14" />
  <meta name="description" content="Apex Trade Lab — 真實行情零風險永續模擬練習" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="APEX" />
  <link rel="manifest" href="apex.webmanifest" />
  <title>APEX — 交易練習室</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="apex.css" />
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="splash" class="splash">
    <div class="splash-atmosphere" aria-hidden="true"></div>
    <div class="splash-inner">
      <div class="splash-mark">APEX</div>
      <p class="splash-sub">真實行情 · 零風險練習</p>
      <p class="splash-tag">交易練習室 · 鋒</p>
      <button type="button" class="btn accent" id="btnEnter">開始練習</button>
      <p class="splash-disc">模擬資金 · 非真實交易 · 與 Bybit 無關聯</p>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="chrome">
      <div class="brand">APEX</div>
      <div class="symbols" id="symbolTabs"></div>
      <div class="ticker-strip" id="tickerStrip">—</div>
      <div class="chrome-right">
        <span class="pill warn" id="demoPill">模擬資金 · 非真實交易</span>
        <span class="pill" id="rankPill">青銅 IV</span>
        <span class="pill" id="connPill">連線中</span>
        <span class="pill muted" id="srcPill">—</span>
      </div>
    </header>

    <main class="main">
      <section class="view active" data-view="trade" id="view-trade">
        <div id="replayBar" class="replay-bar hidden" aria-live="polite"></div>
        <div class="trade-grid">
          <div class="chart-pane">
            <div class="intervals" id="intervals"></div>
            <div id="chart" class="chart"></div>
            <div class="book-trades" id="bookTrades">
              <div class="book" id="book"></div>
              <div class="trades" id="recentTrades"></div>
            </div>
            <button type="button" class="text-btn" id="toggleBook">顯示訂單簿／成交</button>
          </div>
          <aside class="order-pane">
            <div class="ticket-head">
              <div class="ticket-sym" id="ticketSym">BTCUSDT 永續</div>
              <div class="mode-row">
                <div class="seg mini-seg" id="marginModeSeg" title="保證金模式">
                  <button type="button" data-margin="isolated" class="active">逐倉</button>
                  <button type="button" data-margin="cross" disabled title="練習室僅支援逐倉">全倉</button>
                </div>
                <div class="seg mini-seg" id="posModeSeg" title="持倉模式">
                  <button type="button" data-posmode="oneway" class="active">單向</button>
                  <button type="button" data-posmode="hedge" disabled title="練習室僅支援單向持倉">雙向</button>
                </div>
              </div>
              <div class="equity-bar" id="equityBar"></div>
            </div>
            <form id="orderForm" class="order-form" autocomplete="off">
              <div class="row lev-row">
                <button type="button" class="lev-badge" id="levBadge">槓桿 <span id="levVal">5x</span> / 最高 50x</button>
                <input type="range" id="leverage" min="1" max="50" value="5" />
              </div>
              <div class="seg" id="ordTypeSeg">
                <button type="button" data-type="market" class="active">市價</button>
                <button type="button" data-type="limit">限價</button>
                <button type="button" data-type="stop_market">條件市價</button>
                <button type="button" data-type="stop_limit">條件限價</button>
                <button type="button" data-type="stop_trail">追蹤止損</button>
              </div>
              <div class="row checks">
                <label><input type="radio" name="qtyUnit" id="qtyUnitCoin" value="coin" checked /> 幣數量</label>
                <label><input type="radio" name="qtyUnit" id="qtyUnitUsdt" value="usdt" /> USDT 名義</label>
              </div>
              <label class="field">數量 <span id="qtyUnitLabel">（幣）</span>
                <input type="number" id="qty" step="any" min="0" placeholder="0.001" />
              </label>
              <div class="size-chips" id="sizeChips" aria-label="倉位比例">
                <button type="button" data-pct="10">10%</button>
                <button type="button" data-pct="25">25%</button>
                <button type="button" data-pct="50">50%</button>
                <button type="button" data-pct="100">100%</button>
              </div>
              <label class="field limit-only stop-limit-only hidden">限價
                <input type="number" id="limitPrice" step="any" min="0" />
              </label>
              <label class="field cond-only hidden">觸發價
                <input type="number" id="triggerPrice" step="any" min="0" />
              </label>
              <label class="field trail-only hidden">回撤％
                <input type="number" id="trailPct" step="any" min="0.1" max="49" value="1" />
              </label>
              <label class="field limit-only hidden">時效 (TIF)
                <select id="tif">
                  <option value="GTC">GTC</option>
                  <option value="IOC">IOC</option>
                  <option value="PostOnly">只掛單 (PostOnly)</option>
                </select>
              </label>
              <div class="row checks">
                <label><input type="checkbox" id="useTp" /> 止盈</label>
                <input type="number" id="tp" step="any" class="mini" disabled />
                <label><input type="checkbox" id="useSl" /> 停損</label>
                <input type="number" id="sl" step="any" class="mini" disabled />
              </div>
              <div class="size-chips roi-chips" id="roiChips" aria-label="止盈停損快捷">
                <button type="button" data-roi-tp="1">止盈 +1%</button>
                <button type="button" data-roi-tp="2">止盈 +2%</button>
                <button type="button" data-roi-sl="1">停損 -1%</button>
                <button type="button" data-roi-sl="2">停損 -2%</button>
              </div>
              <label class="row checks"><input type="checkbox" id="reduceOnly" /> 只減倉 (Reduce Only)</label>
              <p class="summary" id="preSummary">—</p>
              <div class="side-actions">
                <button type="submit" class="btn long" data-side="long" id="btnLong">做多</button>
                <button type="submit" class="btn short" data-side="short" id="btnShort">做空</button>
              </div>
              <button type="button" class="btn ghost" id="btnClose">市價平倉（當前合約）</button>
            </form>
          </aside>
        </div>
        <div class="bottom-tabs">
          <div class="tab-heads" id="posTabHeads">
            <button type="button" class="active" data-tab="positions">倉位</button>
            <button type="button" data-tab="orders">當前委託</button>
            <button type="button" data-tab="history">成交</button>
            <button type="button" data-tab="closed">已平倉</button>
            <button type="button" class="tab-action" id="btnCloseAll" title="市價平倉全部">全部平倉</button>
            <button type="button" class="tab-action" id="btnCancelAll" title="取消全部委託">全部撤單</button>
          </div>
          <div class="tab-body" id="posTabBody"></div>
        </div>
        <button type="button" class="fab-order" id="fabOrder">下單</button>
      </section>

      <section class="view" data-view="portfolio" id="view-portfolio"></section>
      <section class="view" data-view="analyze" id="view-analyze"></section>
      <section class="view" data-view="rank" id="view-rank"></section>
      <section class="view" data-view="replay" id="view-replay"></section>
      <section class="view" data-view="settings" id="view-settings"></section>
    </main>

    <nav class="nav" aria-label="主導覽">
      <button type="button" data-nav="trade" class="active">交易</button>
      <button type="button" data-nav="portfolio">資產</button>
      <button type="button" data-nav="replay">回放</button>
      <button type="button" data-nav="analyze">分析</button>
      <button type="button" data-nav="rank">段位</button>
      <button type="button" data-nav="settings">設定</button>
    </nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="drawer-backdrop hidden" id="drawerBackdrop">
    <div class="drawer" id="orderDrawer"></div>
  </div>
  <div class="coach hidden" id="coach"></div>

  <footer class="footer-disc">
    Apex Trade Lab 為個人模擬練習工具，不是投資建議。與 Bybit 無關聯。
    模擬撮合／手續費／強平可能與真實交易所不同。段位與成績僅反映本機練習表現。
  </footer>

  <script type="module" src="apex.js"></script>
</body>
</html>
